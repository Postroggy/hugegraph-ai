paths:
  input_version: v2_fault_split
  output_version: v3_disambiguated

thresholds:
  cosine_similarity: 0.85
  edit_distance_ratio: 0.3
  llm_batch_size: 8
  skip_types:
    - VehicleBrand
    - VehicleModel

embedding:
  url: http://10.45.151.13:8000/api/embed
  model: nomic-embed-text
  dim: 1024
  max_chars: 2048
  concurrency: 5
  batch_size: 16
  timeout: 600

llm:
  base_url: https://oneapi-comate.baidu-int.com/v1
  model: DeepSeek-V4-Flash
  concurrency: 5
  timeout: 120
  max_tokens: 4096
  temperature: 0.1
  retries: 4
  disable_thinking: true

validation:
  max_entity_reduction_pct: 20.0
  max_relation_reduction_pct: 15.0
