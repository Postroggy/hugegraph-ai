llm:
  model: DeepSeek-V4-Flash
  workers: 5
  request_timeout: 900
  max_tokens_extract: 40000
  max_tokens_review: 40000
  adaptive_token_steps:
    - 40000
    - 50000
    - 70000
  temperature: 0.0
  api_retries: 4

review:
  max_review_retries: 3
  review_token_threshold: 36000
  direct_pass_score: 85
  min_accept_score: 80
  max_repair_attempts: 2

chunk:
  target_chars: 2000
  max_chars: 2800
  overlap_chars: 200
  min_context_chars: 1000
  small_chunk_target: 1000
  small_chunk_max: 1400
  small_chunk_min: 180

